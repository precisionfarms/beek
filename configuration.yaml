ble_client:
  - mac_address: 53:CB:4A:6D:80:B7
    id: itag_black
    auto_connect: false

# Example configuration entry
sensor:
  - platform: aht10
    i2c_id: bus_a
    variant: AHT20
    temperature:
      id: temperature
      name: "Temperature"
      unit_of_measurement: °C       
    humidity:
      id: humidity
      name: "Humidity"
    update_interval: 10s
  - platform: copy
    source_id: temperature
    id: temp_fahrenheit
    unit_of_measurement: °F
    filters:
      - lambda: 'return x * 1.8 + 32;' 
  - platform: ble_client
    type: characteristic
    ble_client_id: itag_black
    name: "iTag battery level"
    service_uuid: '180f'
    characteristic_uuid: '2a19'
    icon: 'mdi:battery'
    unit_of_measurement: '%'

  - platform: hx711
    name: "HX711 Value"
    dout_pin: 21
    clk_pin: 22
    gain: 128
    update_interval: 60s

climate:
  - platform: thermostat
    id: my_climate    
    name: 'Thermostat'    
    heat_action:
      - switch.turn_on: heat_relay
    idle_action:      
      - switch.turn_off: heat_relay
    sensor: temperature
    humidity_sensor: humidity    
    min_idle_time: 
      seconds: 30
    min_heating_off_time: 300s
    min_heating_run_time: 300s          
    default_preset: Startup Preset
    visual:
      max_temperature:  90 °F
      min_temperature:  20 °F
      temperature_step: 01
    preset:
      - name: Startup Preset
        id: startup_preset
        default_target_temperature_low: 40°F                     
        mode: HEAT
        
time:
  - platform: homeassistant
    id: ha_time
    update_interval:
      minutes: 60
    on_time_sync:
      then:
        - logger.log: "Time synchronized with Home Assistant!"
        - lambda: !lambda |-
            ESP_LOGD("main", "Current time: %s", id(ha_time).now().strftime("%H:%M:%S").c_str());
            //id(deepsleep).set_sleep_duration(60000);
            //id(i2cdev).write_byte(0x38, 0x71);  