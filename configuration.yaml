globals:
  - id: device_guid
    type: std::string
    initial_value: '""' # Initialize as empty string
    restore_value: false # We will manage restoration manually in on_boot

preferences:
  id: my_prefs

http_request:
  verify_ssl: False

interval:       
  - interval: 60min
    startup_delay: 
      minutes: 1
    id: bob
    then:
      - script.execute: send_sensor_data

output:
  - platform: gpio
    pin: GPIO4
    id: gpio_power

switch:
  - platform: gpio
    pin: 16
    id: heat_relay
    name: "Heater"
    icon: mdi:heating-coil
    on_turn_on: 
      then:
        - deep_sleep.prevent: deepsleep  
    on_turn_off: 
      then:
        - delay: 5s                      
        - deep_sleep.allow: deepsleep

i2c:
  sda: GPIO18
  scl: GPIO19
  scan: true
  id: bus_a 

i2c_device:
  id: i2cdev
  address: 0x38

script:
  - id: update_device_state
    then:
      - http_request.send:
          method: "PUT"
          url: !lambda |-
              return ((std::string) "https://www.precisionfarms.com/api/devices");
          request_headers:
            Content-Type: application/json
          json:
            root["status"] = "ON";
            root["brightness"] = 255;
          
      - logger.log: "PUT request sent to update device state."  
           
  - id: send_sensor_data
    then:
      - http_request.post:
          url: "https://www.precisionfarms.com/api/devices/iot" # Replace with your API endpoint
          request_headers:
            Content-Type: "application/json"
          capture_response: True
          json:
            deviceName: "ESPHome"            
            deviceModelId: "3"                        
          on_response:
            then:
              - if:
                  condition:
                      lambda: return response->status_code == 201;
                  then:
                      - lambda: !lambda |-
                          ESP_LOGD("http","Got OK 201");
                          ESP_LOGD("RESPONSE", "response_data size [%d]", body.length());
                          if(!body.empty()) {
                            ESP_LOGD("JSON","About to parse");
                            //ESP_LOGD("JSON","last part of body [%d]}", body.substr(body.size() - 100).c_str());
                            DynamicJsonDocument doc(2048);
                            deserializeJson(doc, body);
                            JsonObject service_response_schedule_lighting = doc["service_response"]["schedule.lighting"];
                          }
                          json::parse_json(body, [](JsonObject root) -> bool {
                              if (root["deviceId"]) {
                                  ESP_LOGW("http_request", "Failed to send data. Status code: %s", root["deviceId"]);
                                  
                                  return true;
                              }
                              else {
                                ESP_LOGI("http_request","No 'vol' key in this json!");
                                return false;
                              }
                          });
                  else:
                      - logger.log:
                          format: "Error: Response status: %d, message %s"
                          args: [ 'response->status_code', 'body.c_str()' ]

